[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-model-engine"
version = "0.1.0"
description = "Professional factor-model research system: point-in-time universe construction, factor exposures, neutralization, factor returns, portfolio risk decomposition, attribution"
requires-python = ">=3.9,<3.13"
dependencies = [
    "pandas>=2.0,<4.0",
    "numpy>=1.23,<3.0",
    "pyyaml>=6.0,<7.0",
    "alpha-validation-toolkit @ git+https://github.com/Patience-Fuglo/alpha-validation-toolkit.git@6d2b375f47fc7045d0c4cdb25ae90c9ebd97630d",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises real CLI subprocesses end to end; still run by default, just slower than the rest of the suite",
]
